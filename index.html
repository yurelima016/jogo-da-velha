<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="favicon.svg" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Jogo da Velha</title>
  </head>
  <body>
    <div id="actualPlayer" class="actualPlayer"></div>

    <div class="scoreboard">
      <span class="score-label">PLACAR</span>
      <div class="score-item x-score">
        <i class="bi bi-x-lg"></i>
        <span id="scoreX">0</span>
      </div>
      <div class="score-item o-score">
        <i class="bi bi-circle"></i>
        <span id="scoreO">0</span>
      </div>
    </div>

    <section id="board">
      <div class="slots" id="slot1" data-row="0" data-col="0"></div>
      <div class="slots" id="slot2" data-row="0" data-col="1"></div>
      <div class="slots" id="slot3" data-row="0" data-col="2"></div>
      <div class="slots" id="slot4" data-row="1" data-col="0"></div>
      <div class="slots" id="slot5" data-row="1" data-col="1"></div>
      <div class="slots" id="slot6" data-row="1" data-col="2"></div>
      <div class="slots" id="slot7" data-row="2" data-col="0"></div>
      <div class="slots" id="slot8" data-row="2" data-col="1"></div>
      <div class="slots" id="slot9" data-row="2" data-col="2"></div>
    </section>

    <section class="black-bg" id="black-bg"></section>
    <div class="popup" id="popup">
      <div class="close-popup" id="close-btn">
        <i class="bi bi-x"></i>
      </div>
      <div class="iconContainer" id="winnerIcon"></div>
      <h1 class="winnerContainer" id="winnerLabel"></h1>
    </div>

    <div class="light-spot" id="light-top-right"></div>
    <div class="light-spot" id="light-bottom-left"></div>
    <script src="script.js"></script>
  </body>
</html>
